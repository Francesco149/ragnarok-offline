[package]
name = "ro-setup-builder"
description = "RagnarokOfflineSetupBuilder.exe: fetches the preserved 2003 euRO CD from the Internet Archive and turns it into the all-in-one installer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "RagnarokOfflineSetupBuilder"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
sha2 = "0.10"
msi = "0.11"
cab = "0.6"
uuid = { version = "1", features = ["v5"] }
crc32fast = "1"
time = "0.3"
# blocking HTTP with its own TLS (rustls + Mozilla's roots): Windows XP's
# SChannel stops at TLS 1.0, which archive.org no longer accepts
ureq = { version = "2.12", default-features = false, features = ["tls"] }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
