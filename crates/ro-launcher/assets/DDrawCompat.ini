; Ragnarok Offline: DDrawCompat settings for the 2003-12-18 euRO client
; (written by RagnarokOffline.exe once; yours to edit, it is never overwritten).
;
; DDrawCompat (https://github.com/narzoul/DDrawCompat, 0BSD) is the ddraw.dll
; next to Ragexe.exe: it fixes DirectX 7 on Windows 10/11 while keeping the
; original rendering path. Shift+F11 in game opens its settings overlay.
; Reference: https://github.com/narzoul/DDrawCompat/wiki/Configuration
; Why each value: docs/WINDOWS.md in the ragnarok-offline repository.

; XP had no ClearType. The client draws text with GDI onto a colour-keyed
; surface, so ClearType edges come out as magenta fringes. Off = the XP look.
FontAntialiasing = off

; The 4:3/5:4 modes a 2003 monitor offered (the client's Setup.exe lists them
; at 16 bpp). Fullscreen is emulated in a borderless window at desktop
; resolution and scaled with black bars, so the real display mode never
; changes. Add "native" to also get the monitor's own modes.
SupportedResolutions = 640x480, 800x600, 1024x768, 1152x864, 1280x960, 1280x1024, 1600x1200

; 16-bit modes look like they did on 2003 GPUs: rendered at 8 bits per
; channel, then ordered-dithered to 5:6:5. "32" gives smooth colour instead.
RenderColorDepth = appd8
